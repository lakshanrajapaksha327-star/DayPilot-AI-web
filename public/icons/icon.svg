<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- AI Star Sparkle Gradient -->
    <linearGradient id="aiSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle / Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Calendar Base Card with Shadow -->
  <g filter="url(#subtleShadow)">
    <!-- Calendar Body -->
    <rect x="96" y="112" width="320" height="304" rx="28" fill="#0f172a" stroke="#334155" stroke-width="4"/>

    <!-- Calendar Top Header Bar -->
    <path d="M 96,140 C 96,124.5 108.5,112 124,112 L 388,112 C 403.5,112 416,124.5 416,140 L 416,192 L 96,192 Z" fill="url(#calHeader)"/>

    <!-- Calendar Ring Clips -->
    <rect x="160" y="88" width="20" height="48" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="3"/>
    <rect x="332" y="88" width="20" height="48" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="3"/>

    <!-- Subtle Calendar Days Grid -->
    <circle cx="156" cy="236" r="10" fill="#334155"/>
    <circle cx="216" cy="236" r="10" fill="#334155"/>
    <circle cx="276" cy="236" r="10" fill="#334155"/>
    <circle cx="336" cy="236" r="10" fill="#334155"/>

    <circle cx="156" cy="296" r="10" fill="#334155"/>
    <circle cx="336" cy="296" r="10" fill="#334155"/>

    <circle cx="156" cy="356" r="10" fill="#334155"/>
    <circle cx="216" cy="356" r="10" fill="#334155"/>
    <circle cx="276" cy="356" r="10" fill="#334155"/>
    <circle cx="336" cy="356" r="10" fill="#334155"/>
  </g>

  <!-- Central Glowing AI Sparkle Star -->
  <g filter="url(#aiGlow)">
    <!-- Glowing backing radial circle -->
    <circle cx="256" cy="296" r="54" fill="#38bdf8" opacity="0.18"/>

    <!-- 4-point Diamond Star -->
    <path d="M 256,216 Q 256,296 176,296 Q 256,296 256,376 Q 256,296 336,296 Q 256,296 256,216 Z" fill="url(#aiSparkle)"/>

    <!-- Inner Core Bright Star -->
    <path d="M 256,252 Q 256,296 212,296 Q 256,296 256,340 Q 256,296 300,296 Q 256,296 256,252 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Small Secondary AI Star at top right -->
    <path d="M 370,140 Q 370,154 356,154 Q 370,154 370,168 Q 370,154 384,154 Q 370,154 370,140 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
